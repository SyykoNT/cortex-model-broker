name: Broker CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  full-suite-and-gitleaks:
    name: full-suite-and-gitleaks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.14'
      - name: Install production and browser-test dependencies
        run: |
          python -m pip install -r requirements.txt playwright==1.63.0
          python -m playwright install --with-deps chromium

      - name: Fetch every advertised branch and tag
        run: git fetch --force --tags origin '+refs/heads/*:refs/remotes/origin/*'
      - name: Install checksum-pinned gitleaks
        env:
          GITLEAKS_VERSION: '8.30.1'
          GITLEAKS_SHA256: '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb'
        run: |
          cd "$RUNNER_TEMP"
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}" -o "$archive"
          printf '%s  %s\n' "$GITLEAKS_SHA256" "$archive" | sha256sum --check --strict
          tar -xzf "$archive" gitleaks
      - name: Scan complete history and working tree
        run: |
          "$RUNNER_TEMP/gitleaks" git --log-opts=--all --redact --exit-code=1 .
          "$RUNNER_TEMP/gitleaks" dir --redact --exit-code=1 .
      - name: Run every test (skips are failures)
        run: |
          export TEST_GITLEAKS="$RUNNER_TEMP/gitleaks"
          export TEST_CHROMIUM="$(python -c 'from playwright.sync_api import sync_playwright; p = sync_playwright().start(); print(p.chromium.executable_path); p.stop()')"
          python - <<'PY'
          import unittest
          suite = unittest.defaultTestLoader.discover('tests')
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          raise SystemExit(not result.wasSuccessful() or bool(result.skipped) or result.testsRun == 0)
          PY
